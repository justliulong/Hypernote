<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self' data: blob:;
    script-src 'self' 'unsafe-inline' data:;
    style-src 'self' 'unsafe-inline';
    frame-src notes: data: blob:;
    img-src 'self' data: blob: https: http:;
  ">
  <title>预览 — Hypernote</title>
  <link rel="stylesheet" href="css/theme.css">
  <style>
    .standalone {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--bg-app);
    }
    .bar {
      height: var(--h-bar);
      flex: none;
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      padding: 0 var(--sp-3) 0 var(--sp-5);
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border);
    }
    .bar .label {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      font-size: var(--fs-sm);
      color: var(--text-dim);
    }
    .bar .label .name {
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .bar .label .dir {
      color: var(--text-faint);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .bar .actions { display: flex; gap: var(--sp-1); }
    .frame-host { flex: 1; min-height: 0; position: relative; background: #fff; }
    iframe { width: 100%; height: 100%; border: none; display: block; background: #fff; }
    .empty-host {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: var(--bg-editor);
    }
  </style>
</head>
<body>
  <div class="standalone">
    <div class="bar">
      <div class="label">
        <span data-icon="eye"></span>
        <span class="name" id="preview-title">未选择笔记</span>
        <span class="dir" id="preview-dir"></span>
      </div>
      <div class="actions">
        <button class="icon-btn" id="btn-refresh" title="刷新">
          <span data-icon="refresh"></span>
        </button>
        <button class="icon-btn" id="btn-open-browser" title="在系统浏览器中打开">
          <span data-icon="external-link"></span>
        </button>
        <button class="icon-btn" id="btn-close" title="关闭窗口">
          <span data-icon="x"></span>
        </button>
      </div>
    </div>
    <div class="frame-host">
      <iframe id="frame" title="笔记预览"></iframe>
      <div class="empty-host" id="empty">
        <div class="empty">
          <span data-icon="eye" data-icon-class="icon icon-lg"></span>
          <p>在主窗口中打开一篇笔记</p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/preview-window.js"></script>
</body>
</html>
